apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: collectorforopenshift
  namespace: collectorforopenshift
  annotations:
    collectord.collectord.io/logs-replace.ignoredebuglog-search: ^(TRACE|DEBUG) .*
    collectord.collectord.io/logs-replace.ignoredebuglog-val: ""
  labels:
    app: collectorforopenshift
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      daemon: collectorforopenshift
  template:
    metadata:
      name: collectorforopenshift
      annotations:
        # A change to the configuration files these pods mount rolls them:
        # Collectord reads its inputs' configuration at startup. A ConfigMap managed
        # outside the chart (configMap.create: false) gets no checksum: roll the pods
        # with an annotation of your own under podAnnotations.
        checksum/config: 2fb62542aa0403769c9d122b55fad265f357d32dfcf8a5093d680d281fcecf73
      labels:
        daemon: collectorforopenshift
    spec:
      priorityClassName: "system-node-critical"
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      serviceAccountName: collectorforopenshift
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: eks.amazonaws.com/compute-type
                operator: NotIn
                values:
                - fargate
              - key: type
                operator: NotIn
                values:
                - virtual-kubelet
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
      containers:
      - name: collectorforopenshift
        image: registry.connect.redhat.com/outcoldsolutions/collectorforopenshift:26.10.1
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            host: 127.0.0.1
            path: /healthz
            port: 11888
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 3
          httpGet:
            host: 127.0.0.1
            path: /readyz
            port: 11888
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        securityContext:
          runAsUser: 0
          privileged: true
        resources:
          limits:
            cpu: 2000m
            memory: 1024Mi
          requests:
            cpu: 500m
            memory: 256Mi
        env:
        - name: KUBERNETES_NODENAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: KUBERNETES_NODEIP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: collectorforopenshift-state
          mountPath: /data
        - name: collectorforopenshift-config
          mountPath: /config/
          readOnly: true
        - name: rootfs
          mountPath: /rootfs/
          readOnly: false
          mountPropagation: HostToContainer
        - name: localtime
          mountPath: /etc/localtime
          readOnly: true

      volumes:
      - name: collectorforopenshift-state
        hostPath:
          path: /var/lib/collectorforopenshift/data/
          type: DirectoryOrCreate
      - name: rootfs
        hostPath:
          path: /
      - name: localtime
        hostPath:
          path: /etc/localtime
      - name: collectorforopenshift-config
        configMap:
          name: collectorforopenshift
          items:
          - key: 001-general.conf
            path: 001-general.conf
          - key: 002-daemonset.conf
            path: 002-daemonset.conf
---
