            - ALL
          privileged: false
          runAsUser: 0
          seLinuxOptions:
            type: spc_t
          seccompProfile:
            type: RuntimeDefault
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 64Mi
        env:
        - name: KUBERNETES_NODENAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: collectorforopenshift-state
          mountPath: /data
        - name: collectorforopenshift-config
          mountPath: /config/
          readOnly: true
        - name: localtime
          mountPath: /etc/localtime
          readOnly: true

      volumes:
      # The DaemonSet pod on this node owns the directory and the database the
      # addon opens read-only. DirectoryOrCreate, so an addon scheduled first
      # mounts it too; Collectord waits for the DaemonSet to create the database.
      - name: collectorforopenshift-state
        hostPath:
          path: /var/lib/collectorforopenshift/data/
          type: DirectoryOrCreate
      - name: localtime
        hostPath:
          path: /etc/localtime
      - name: collectorforopenshift-config
        configMap:
          name: collectorforopenshift
          items:
          - key: 001-general.conf
            path: 001-general.conf
          - key: 004-addon.conf
            path: 004-addon.conf
