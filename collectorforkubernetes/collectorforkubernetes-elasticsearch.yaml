      "priority": 1000,
      "template": {
        "settings": {
          "index": {
            "lifecycle": {
              "name": "logs-collectord"
            },
            "refresh_interval": "5s",
            "mapping": {
              "total_fields": {
                "limit": "10000"
              }
            },
            "max_docvalue_fields_search": "200"
          },
          "query": {
            "default_field": [
              "message"
            ]
          }
        },
        "mappings": {
          "properties": {
            "@timestamp": {
              "type": "date"},
            "message": {
              "type": "match_only_text"}
          }
        }
      },
      "index_patterns": [
        "logs-collectord-failed-${COLLECTORD_VERSION}"]
    }
