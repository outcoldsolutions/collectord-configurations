apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: collectorforkubernetes-elasticsearch
  namespace: collectorforkubernetes
  annotations:
    collectord.collectord.io/logs-replace.ignoredebuglog-search: ^(TRACE|DEBUG) .*
    collectord.collectord.io/logs-replace.ignoredebuglog-val: ""
  labels:
    app: collectorforkubernetes-elasticsearch
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      daemon: collectorforkubernetes-elasticsearch
  template:
    metadata:
      name: collectorforkubernetes-elasticsearch
      annotations:
        # A change to the configuration files these pods mount rolls them:
        # Collectord reads its inputs' configuration at startup. A ConfigMap managed
        # outside the chart (configMap.create: false) gets no checksum: roll the pods
        # with an annotation of your own under podAnnotations.
        checksum/config: bfbdfd8d4d70aa570006a0f97adc4ee277e73636c2c32e48e56069701dd3a4d9
      labels:
        daemon: collectorforkubernetes-elasticsearch
    spec:
      priorityClassName: "system-node-critical"
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      serviceAccountName: collectorforkubernetes
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: eks.amazonaws.com/compute-type
                operator: NotIn
                values:
                - fargate
              - key: type
                operator: NotIn
                values:
                - virtual-kubelet
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
      containers:
      - name: collectorforkubernetes
        image: registry.outcold.solutions/outcoldsolutions/collectorforkubernetes:26.10.1
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            host: 127.0.0.1
            path: /healthz
            port: 11891
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 3
          httpGet:
            host: 127.0.0.1
            path: /readyz
            port: 11891
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        securityContext:
          runAsUser: 0
          privileged: true
        resources:
          limits:
            cpu: 2000m
            memory: 1024Mi
          requests:
            cpu: 500m
            memory: 256Mi
        env:
        - name: KUBERNETES_NODENAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: KUBERNETES_NODEIP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: collectorforkubernetes-state
          mountPath: /data
        - name: collectorforkubernetes-config
          mountPath: /config/
          readOnly: true
        - name: rootfs
          mountPath: /rootfs/
          readOnly: false
          mountPropagation: HostToContainer
        - name: localtime
          mountPath: /etc/localtime
          readOnly: true

      volumes:
      - name: collectorforkubernetes-state
        hostPath:
          path: /var/lib/collectorforkubernetes-elasticsearch/data/
          type: DirectoryOrCreate
      - name: rootfs
        hostPath:
          path: /
      - name: localtime
        hostPath:
          path: /etc/localtime
      - name: collectorforkubernetes-config
        configMap:
          name: collectorforkubernetes-elasticsearch
          items:
          - key: 001-general.conf
            path: 001-general.conf
          - key: 002-daemonset.conf
            path: 002-daemonset.conf
          - key: es-default-index-lifecycle-management-policy.json
            path: es-default-index-lifecycle-management-policy.json
          - key: es-default-index-template.json
            path: es-default-index-template.json
          - key: es-failed-index-template.json
            path: es-failed-index-template.json
